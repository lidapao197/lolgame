<!DOCTYPE html>
<html lang="zh-CN" data-accent="indigo">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LOL赛事日历</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="index.css">
</head>
<body>

<!-- 顶部悬浮导航：iOS 毛玻璃胶囊，切换首页 / 音乐 -->
<nav class="fnav" id="fnav" aria-label="页面导航">
  <span class="fnav-ind" id="fnavInd" aria-hidden="true"></span>
  <button class="fnav-item on" data-view="home" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 9.7V21h14V9.7"/></svg>
    <span>首页</span>
  </button>
  <button class="fnav-item" data-view="film" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M7 5v14M17 5v14M2.5 12h19"/></svg>
    <span>影视</span>
  </button>
  <button class="fnav-item" data-view="music" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18.5V6l11-2.5V16"/><circle cx="6.5" cy="18.5" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>
    <span>音乐</span>
  </button>
</nav>

<div class="app" id="viewHome">
  <header>
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3.5"/><path d="M3 9.5h18M8 2.8v3.4M16 2.8v3.4"/><path d="M8.4 14.2h.01M12 14.2h.01M15.6 14.2h.01M8.4 17.4h.01M12 17.4h.01"/></svg>
      </span>
      <div class="brand-txt">
        <b>LOL 赛事日历</b>
        <span>英雄联盟 · 官方赛程</span>
      </div>
    </div>

    <div class="tools">
      <div class="gsel" id="gsel" data-state="loading">
        <button class="gsel-btn" id="gselBtn" type="button" aria-haspopup="listbox" aria-expanded="false" title="选择赛事">
          <span class="gsel-dot"></span>
          <span class="gsel-txt" id="gselTxt">正在请求数据…</span>
          <svg class="gsel-arw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="gsel-menu" id="gselMenu" role="listbox" hidden></div>
      </div>

      <div class="navgroup">
        <button class="pill icon ghost" id="prev" title="上一月 (←)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="monthbtn" id="monthBtn" title="选择月份">
          <span id="monthBtnText">—</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <button class="pill icon ghost" id="next" title="下一月 (→)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>

        <div class="mpick" id="mpick">
          <div class="mpick-year">
            <button class="pill icon ghost" id="yPrev" title="上一年">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <span id="pickYear">—</span>
            <button class="pill icon ghost" id="yNext" title="下一年">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>
          <div class="mpick-grid" id="pickGrid"></div>
          <button class="mpick-foot" id="pickToday">回到本月</button>
        </div>
      </div>

      <button class="pill" id="today">今天</button>

      <!-- 主题色：色板按钮 + 弹出色卡 -->
      <div class="acc-wrap">
        <button class="pill icon ghost" id="accent" type="button" title="切换主题色" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="8.8" cy="9.4" r="1.15" fill="currentColor" stroke="none"/><circle cx="12" cy="7.8" r="1.15" fill="currentColor" stroke="none"/><circle cx="15.2" cy="9.4" r="1.15" fill="currentColor" stroke="none"/><circle cx="14.4" cy="13.2" r="1.15" fill="currentColor" stroke="none"/><circle cx="9.6" cy="13.2" r="1.15" fill="currentColor" stroke="none"/></svg>
        </button>
        <div class="acc-pop" id="accPop" hidden role="group" aria-label="主题色">
          <button class="acc-dot on" type="button" data-accent="indigo" style="--c:#4f46e5" title="靛蓝"></button>
          <button class="acc-dot" type="button" data-accent="blue" style="--c:#2f7ff0" title="天蓝"></button>
          <button class="acc-dot" type="button" data-accent="purple" style="--c:#7c5cff" title="紫罗兰"></button>
          <button class="acc-dot" type="button" data-accent="pink" style="--c:#e8558e" title="樱粉"></button>
          <button class="acc-dot" type="button" data-accent="orange" style="--c:#ef7c26" title="暖橙"></button>
          <button class="acc-dot" type="button" data-accent="teal" style="--c:#0d9b9b" title="青碧"></button>
          <button class="acc-dot" type="button" data-accent="green" style="--c:#00a76e" title="翠绿"></button>
        </div>
      </div>
    </div>
  </header>

  <section class="board">
    <div class="weekdays" id="weekdays"></div>
    <div class="days" id="days"></div>
  </section>

  <!-- 手机版：月视图下方直接列出选中日期的赛程（桌面用右侧抽屉） -->
  <section class="detail" id="detail" hidden>
    <div class="dlist" id="mlist"></div>
  </section>
</div>

<!-- 音乐视图：播放 data/music.json 里的歌曲 -->
<section class="mview" id="viewMusic" hidden>
  <div class="player">
    <div class="np">
      <div class="cover" id="cover">
        <img id="coverImg" alt="" hidden>
        <svg id="coverPh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18.5V6l11-2.5V16"/><circle cx="6.5" cy="18.5" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>
      </div>
      <div class="np-meta">
        <div class="np-title" id="npTitle">未在播放</div>
        <div class="np-artist" id="npArtist">选择一首开始欣赏</div>
      </div>
      <div class="ctrl">
        <button class="cbtn cbtn-shuffle" id="pShuffle" title="顺序播放（点击切换随机）" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
        </button>
        <button class="cbtn" id="pPrev" title="上一首">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 18.5l-8-6.5 8-6.5v13z"/><path d="M6.5 5.5v13"/></svg>
        </button>
        <button class="cbtn cbtn-play" id="pPlay" title="播放 / 暂停">
          <svg id="icPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 5.5v13l10.5-6.5z"/></svg>
          <svg id="icPause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" hidden><path d="M8.5 5.5v13M15.5 5.5v13"/></svg>
        </button>
        <button class="cbtn" id="pNext" title="下一首">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 5.5l8 6.5-8 6.5v-13z"/><path d="M17.5 5.5v13"/></svg>
        </button>
      </div>
    </div>
    <div class="pbar">
      <span id="tCur">0:00</span>
      <div class="track" id="track">
        <div class="track-rail">
          <div class="track-fill" id="trackFill"></div>
          <div class="track-thumb" id="trackThumb"></div>
        </div>
      </div>
      <span id="tDur">0:00</span>

      <!-- 音量：喇叭按钮静音切换 + 可拖拽滑杆 -->
      <div class="vol">
        <button class="vbtn" id="vBtn" type="button" title="静音">
          <svg id="vIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        </button>
        <div class="vtrack" id="vTrack" title="音量" role="slider" aria-label="音量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80" tabindex="0">
          <div class="vrail">
            <div class="vfill" id="vFill"></div>
            <div class="vthumb" id="vThumb"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="plist-head" id="plistHead" hidden>播放列表</div>
  <div class="plist" id="plist"></div>
  <div class="empty" id="mEmpty" hidden><span class="em">🎵</span>暂无音乐<br>检查 data/music.json 是否存在且格式正确</div>
</section>

<!-- 影视视图：按平台切换，每个分类一行 20 张海报，可前后翻页 -->
<section class="fview" id="viewFilm" hidden>
  <div class="fbar">
    <div class="ftabs" id="fTabs" role="tablist" aria-label="平台">
      <button class="ftab on" type="button" data-site="tencent" role="tab" aria-selected="true">腾讯视频</button>
      <button class="ftab" type="button" data-site="youku" role="tab" aria-selected="false">优酷</button>
      <button class="ftab" type="button" data-site="iqiyi" role="tab" aria-selected="false">爱奇艺</button>
      <button class="ftab" type="button" data-site="mango" role="tab" aria-selected="false">芒果TV</button>
    </div>
  </div>
  <div class="frows" id="fRows"></div>
</section>

<audio id="audio" preload="metadata"></audio>

<div class="toasts" id="toasts"></div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="日程详情">
  <div class="top">
    <div>
      <div class="d1" id="dTitle">—</div>
      <div class="d2" id="dMeta">—</div>
    </div>
    <button class="x" id="close" title="关闭 (Esc)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="dlist" id="dlist"></div>
</aside>

<!-- 影视详情弹层：点海报打开，只展示信息，不跳转外站 -->
<div class="fmodal" id="fModal" hidden>
  <div class="fmodal-scrim" id="fScrim"></div>
  <div class="fmodal-card" role="dialog" aria-modal="true" aria-labelledby="fmTitle">
    <button class="fmodal-x" id="fClose" type="button" title="关闭 (Esc)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="fmodal-body">
      <div class="fmodal-poster"><img id="fmPoster" alt="" referrerpolicy="no-referrer"></div>
      <div class="fmodal-info">
        <h3 id="fmTitle">—</h3>
        <div class="fm-tags" id="fmTags"></div>
        <p class="fm-desc" id="fmDesc"></p>
        <div class="fm-rows" id="fmRows"></div>
      </div>
    </div>
  </div>
</div>

<script src="index.js"></script>
</body>
</html>
